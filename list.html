<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria | Dziennik podróży</title>
  <meta name="description" content="Zdjęcia z podróży i odwiedzonych miejsc." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header class="gallery-header">
    <a class="gallery-brand" href="index.html">Dziennik podróży</a>
    <nav class="gallery-navigation" aria-label="Główna nawigacja">
      <a href="index.html">Mapa</a>
      <a class="is-active" href="list.html" aria-current="page">Galeria</a>
    </nav>
  </header>

  <main class="gallery-page">
    <section class="gallery-intro" aria-labelledby="gallery-title">
      <p class="gallery-eyebrow">Wspomnienia w kadrach</p>
      <h1 id="gallery-title">Galeria podróży</h1>
      <p>Okładki podróży oraz zdjęcia odwiedzonych miejsc.</p>
    </section>
    <p id="galleryStatus" class="gallery-status" role="status">Ładowanie zdjęć…</p>
    <section id="galleryContent" class="travel-gallery" aria-live="polite"></section>
  </main>

  <dialog id="photoDialog" class="photo-dialog" aria-labelledby="dialogTitle">
    <button id="dialogClose" class="dialog-close" type="button" aria-label="Zamknij zdjęcie">×</button>
    <button id="dialogPrevious" class="dialog-arrow dialog-previous" type="button" aria-label="Poprzednie zdjęcie">‹</button>
    <figure class="dialog-figure">
      <img id="dialogImage" src="" alt="" />
      <figcaption>
        <strong id="dialogTitle"></strong>
        <span id="dialogDescription"></span>
      </figcaption>
    </figure>
    <button id="dialogNext" class="dialog-arrow dialog-next" type="button" aria-label="Następne zdjęcie">›</button>
  </dialog>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcRB_dec2OunBPevgemcWouCfDP6dNZV4",
      authDomain: "moj-dziennik-podrozy.firebaseapp.com",
      databaseURL: "https://moj-dziennik-podrozy-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "moj-dziennik-podrozy",
      storageBucket: "moj-dziennik-podrozy.firebasestorage.app",
      messagingSenderId: "997572019753",
      appId: "1:997572019753:web:0f5aa78a1c24072de3be38"
    };

    const database = getDatabase(initializeApp(firebaseConfig));
    const gallery = document.getElementById("galleryContent");
    const status = document.getElementById("galleryStatus");
    const dialog = document.getElementById("photoDialog");
    const dialogImage = document.getElementById("dialogImage");
    const dialogTitle = document.getElementById("dialogTitle");
    const dialogDescription = document.getElementById("dialogDescription");
    const media = [];
    let activePhotoIndex = 0;

    function safeImageUrl(value) {
      if (typeof value !== "string" || value.trim() === "") return null;
      try {
        const url = new URL(value.trim(), window.location.href);
        return ["http:", "https:"].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    function text(value, fallback = "") {
      return typeof value === "string" && value.trim() ? value.trim() : fallback;
    }

    function createMediaCard(item) {
      const card = document.createElement("article");
      card.className = "travel-gallery-card";

      const button = document.createElement("button");
      button.type = "button";
      button.className = "travel-gallery-image-button";
      button.setAttribute("aria-label", `Powiększ zdjęcie: ${item.title}`);
      button.addEventListener("click", () => openPhoto(media.indexOf(item)));

      const image = document.createElement("img");
      image.src = item.url;
      image.alt = item.alt;
      image.loading = "lazy";
      image.decoding = "async";
      image.addEventListener("error", () => card.remove());
      button.appendChild(image);
      card.appendChild(button);

      const content = document.createElement("div");
      content.className = "travel-gallery-card-content";
      const badge = document.createElement("span");
      badge.className = "travel-gallery-badge";
      badge.textContent = item.kind;
      const heading = document.createElement("h2");
      heading.textContent = item.title;
      const detail = document.createElement("p");
      detail.textContent = item.description;
      content.append(badge, heading, detail);
      card.appendChild(content);
      return card;
    }

    function addMedia(url, title, description, kind, alt) {
      const safeUrl = safeImageUrl(url);
      if (!safeUrl) return;
      media.push({ url: safeUrl, title, description, kind, alt });
    }

    function collectMedia(trips) {
      Object.entries(trips || {}).forEach(([, trip]) => {
        const tripName = text(trip.name, "Podróż bez nazwy");
        addMedia(trip.image, tripName, "Okładka podróży", "Okładka podróży", `Okładka podróży: ${tripName}`);

        Object.values(trip.places || {}).forEach((place) => {
          const placeName = text(place.name, "Miejsce bez nazwy");
          const description = `${placeName} · ${tripName}`;
          const seenUrls = new Set();
          const addPlacePhoto = (url, kind, caption) => {
            const safeUrl = safeImageUrl(url);
            if (!safeUrl || seenUrls.has(safeUrl)) return;
            seenUrls.add(safeUrl);
            addMedia(safeUrl, placeName, caption || description, kind, caption || `Zdjęcie miejsca ${placeName} podczas podróży ${tripName}`);
          };

          addPlacePhoto(place.image, "Zdjęcie miejsca", description);
          (Array.isArray(place.photos) ? place.photos : []).forEach((photo) => {
            addPlacePhoto(photo?.url, "Zdjęcie miejsca", text(photo?.caption, description));
          });
        });
      });
    }

    function renderGallery() {
      gallery.replaceChildren();
      if (media.length === 0) {
        status.textContent = "Nie ma jeszcze zdjęć do pokazania. Dodaj zdjęcie do podróży lub miejsca.";
        return;
      }
      status.textContent = `Liczba zdjęć: ${media.length}`;
      const fragment = document.createDocumentFragment();
      media.forEach((item) => fragment.appendChild(createMediaCard(item)));
      gallery.appendChild(fragment);
    }

    function renderDialog() {
      const item = media[activePhotoIndex];
      if (!item) return;
      dialogImage.src = item.url;
      dialogImage.alt = item.alt;
      dialogTitle.textContent = item.title;
      dialogDescription.textContent = item.description;
      const showNavigation = media.length > 1;
      document.getElementById("dialogPrevious").hidden = !showNavigation;
      document.getElementById("dialogNext").hidden = !showNavigation;
    }

    function openPhoto(index) {
      activePhotoIndex = index;
      renderDialog();
      dialog.showModal();
    }

    function changePhoto(direction) {
      activePhotoIndex = (activePhotoIndex + direction + media.length) % media.length;
      renderDialog();
    }

    document.getElementById("dialogClose").addEventListener("click", () => dialog.close());
    document.getElementById("dialogPrevious").addEventListener("click", () => changePhoto(-1));
    document.getElementById("dialogNext").addEventListener("click", () => changePhoto(1));
    dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
    document.addEventListener("keydown", (event) => {
      if (!dialog.open || media.length < 2) return;
      if (event.key === "ArrowLeft") changePhoto(-1);
      if (event.key === "ArrowRight") changePhoto(1);
    });

    async function loadGallery() {
      try {
        const snapshot = await get(ref(database, "trips"));
        collectMedia(snapshot.val());
        renderGallery();
      } catch (error) {
        console.error("Błąd ładowania galerii:", error);
        status.textContent = "Nie udało się załadować galerii. Spróbuj odświeżyć stronę.";
      }
    }

    loadGallery();
  </script>
</body>
</html>
