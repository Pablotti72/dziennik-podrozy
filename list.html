<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria podróży | Dziennik podróży</title>
  <meta name="description" content="Wybierz podróż i zobacz związane z nią zdjęcia." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header class="gallery-header">
    <a class="gallery-brand" href="index.html">Dziennik podróży</a>
    <nav class="gallery-navigation" aria-label="Główna nawigacja">
      <a href="index.html">Mapa</a>
      <a class="is-active" href="list.html" aria-current="page">Galeria</a>
    </nav>
  </header>

  <main class="gallery-page">
    <a id="backToTrips" class="back-to-trips" href="list.html" hidden>← Wszystkie podróże</a>
    <section class="gallery-intro" aria-labelledby="galleryTitle">
      <p id="galleryEyebrow" class="gallery-eyebrow">Wspomnienia w kadrach</p>
      <h1 id="galleryTitle">Podróże</h1>
      <p id="galleryDescription">Wybierz wyprawę, aby przejść do odwiedzonych miejsc.</p>
    </section>
    <p id="galleryStatus" class="gallery-status" role="status">Ładowanie podróży…</p>
    <section id="galleryContent" class="travel-gallery" aria-live="polite"></section>
  </main>

  <dialog id="photoDialog" class="photo-dialog" aria-labelledby="dialogTitle">
    <button id="dialogClose" class="dialog-close" type="button" aria-label="Zamknij zdjęcie">×</button>
    <button id="dialogPrevious" class="dialog-arrow dialog-previous" type="button" aria-label="Poprzednie zdjęcie">‹</button>
    <figure class="dialog-figure">
      <img id="dialogImage" src="" alt="" />
      <figcaption><strong id="dialogTitle"></strong><span id="dialogDescription"></span></figcaption>
    </figure>
    <button id="dialogNext" class="dialog-arrow dialog-next" type="button" aria-label="Następne zdjęcie">›</button>
  </dialog>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcRB_dec2O2unBPevgemcWouCfDP6dNZV4",
      authDomain: "moj-dziennik-podrozy.firebaseapp.com",
      databaseURL: "https://moj-dziennik-podrozy-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "moj-dziennik-podrozy",
      storageBucket: "moj-dziennik-podrozy.firebasestorage.app",
      messagingSenderId: "997572019753",
      appId: "1:997572019753:web:0f5aa78a1c24072de3be38"
    };

    const database = getDatabase(initializeApp(firebaseConfig));
    const gallery = document.getElementById("galleryContent");
    const status = document.getElementById("galleryStatus");
    const backToTrips = document.getElementById("backToTrips");
    const galleryEyebrow = document.getElementById("galleryEyebrow");
    const galleryTitle = document.getElementById("galleryTitle");
    const galleryDescription = document.getElementById("galleryDescription");

    const dialog = document.getElementById("photoDialog");
    const dialogImage = document.getElementById("dialogImage");
    const dialogTitle = document.getElementById("dialogTitle");
    const dialogDescription = document.getElementById("dialogDescription");

    const params = new URLSearchParams(window.location.search);
    const tripId = params.get("trip");
    const placeId = params.get("place");

    let photos = [];
    let activePhotoIndex = 0;

    function safeImageUrl(value) {
      if (typeof value !== "string" || value.trim() === "") return null;
      try {
        const url = new URL(value.trim(), window.location.href);
        return ["http:", "https:"].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    function text(value, fallback = "") {
      return typeof value === "string" && value.trim() ? value.trim() : fallback;
    }

    function createEmptyState(message) {
      gallery.replaceChildren();
      status.textContent = message;
    }

    function setHeader(eyebrow, title, description, backHref = null, backText = "← Wszystkie wyprawy") {
      galleryEyebrow.textContent = eyebrow;
      galleryTitle.textContent = title;
      galleryDescription.textContent = description;

      if (backHref) {
        backToTrips.hidden = false;
        backToTrips.href = backHref;
        backToTrips.textContent = backText;
      } else {
        backToTrips.hidden = true;
      }
    }

    function getTripCover(trip) {
      const direct = safeImageUrl(trip?.image);
      if (direct) return direct;

      for (const place of Object.values(trip?.places || {})) {
        const placeCover = getPlaceCover(place || {});
        if (placeCover) return placeCover;
      }

      return null;
    }

    function createTripCard(id, trip) {
      const imageUrl = getTripCover(trip);
      const name = text(trip.name, "Wyprawa bez nazwy");
      const link = document.createElement("a");
      link.className = "trip-cover-card";
      link.href = `list.html?trip=${encodeURIComponent(id)}`;
      link.setAttribute("aria-label", `Zobacz miejsca z wyprawy: ${name}`);

      if (imageUrl) {
        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = `Okładka wyprawy: ${name}`;
        image.loading = "lazy";
        image.decoding = "async";
        image.addEventListener("error", () => image.replaceWith(createTripPlaceholder()));
        link.appendChild(image);
      } else {
        link.appendChild(createTripPlaceholder());
      }

      const overlay = document.createElement("div");
      overlay.className = "trip-cover-content";

      const label = document.createElement("span");
      label.textContent = "Wyprawa";

      const heading = document.createElement("h2");
      heading.textContent = name;

      overlay.append(label, heading);
      link.appendChild(overlay);
      return link;
    }

    function createTripPlaceholder() {
      const placeholder = document.createElement("div");
      placeholder.className = "trip-cover-placeholder";
      placeholder.setAttribute("aria-hidden", "true");
      return placeholder;
    }

    function getPlaceCover(place) {
      const direct = safeImageUrl(place.image);
      if (direct) return direct;

      const firstPhoto = Array.isArray(place.photos)
        ? place.photos.find(photo => safeImageUrl(photo?.url))
        : null;

      return firstPhoto ? safeImageUrl(firstPhoto.url) : null;
    }

    function createPlaceCard(tripIdValue, placeIdValue, place) {
      const imageUrl = getPlaceCover(place);
      if (!imageUrl) return null;

      const name = text(place.name, "Miejsce bez nazwy");
      const link = document.createElement("a");
      link.className = "place-cover-card";
      link.href = `list.html?trip=${encodeURIComponent(tripIdValue)}&place=${encodeURIComponent(placeIdValue)}`;
      link.setAttribute("aria-label", `Zobacz zdjęcia miejsca: ${name}`);

      const image = document.createElement("img");
      image.src = imageUrl;
      image.alt = `Zdjęcie miejsca: ${name}`;
      image.loading = "lazy";
      image.decoding = "async";
      image.addEventListener("error", () => link.remove());

      const overlay = document.createElement("div");
      overlay.className = "trip-cover-content";

      const label = document.createElement("span");
      label.textContent = "Miejsce";

      const heading = document.createElement("h2");
      heading.textContent = name;

      overlay.append(label, heading);
      link.append(image, overlay);
      return link;
    }

    function renderTripCovers(trips) {
      setHeader("Wspomnienia w kadrach", "Wyprawy",
        "Wybierz wyprawę, aby przejść do odwiedzonych miejsc.");

      gallery.replaceChildren();
      const fragment = document.createDocumentFragment();
      let count = 0;

      Object.entries(trips || {}).forEach(([id, trip]) => {
        const card = createTripCard(id, trip || {});
        if (card) {
          fragment.appendChild(card);
          count += 1;
        }
      });

      if (count === 0) {
        createEmptyState("Nie ma jeszcze wypraw z okładkami do pokazania.");
        return;
      }

      status.textContent = `Liczba wypraw: ${count}`;
      gallery.appendChild(fragment);
    }

    function renderPlaceCovers(trip) {
      const name = text(trip.name, "Wyprawa bez nazwy");

      setHeader("Galeria wyprawy", name,
        "Wybierz miejsce, aby zobaczyć zdjęcia z tego miejsca.",
        "list.html", "← Wszystkie wyprawy");

      gallery.replaceChildren();
      const fragment = document.createDocumentFragment();
      let count = 0;

      Object.entries(trip.places || {}).forEach(([id, place]) => {
        const card = createPlaceCard(tripId, id, place || {});
        if (card) {
          fragment.appendChild(card);
          count += 1;
        }
      });

      if (count === 0) {
        createEmptyState("Ta wyprawa nie ma jeszcze miejsc ze zdjęciami.");
        return;
      }

      status.textContent = `Liczba miejsc: ${count}`;
      gallery.appendChild(fragment);
    }

    function addPhoto(url, placeName, caption) {
      const safeUrl = safeImageUrl(url);
      if (!safeUrl || photos.some(photo => photo.url === safeUrl)) return;

      photos.push({
        url: safeUrl,
        title: "",
        description: text(caption, ""),
        alt: text(caption, `Zdjęcie miejsca: ${placeName}`)
      });
    }

    function collectPlacePhotos(place) {
      const placeName = text(place.name, "Miejsce bez nazwy");

      // Etap 3 pokazuje wyłącznie zdjęcia zapisane w galerii miejsca.
      (Array.isArray(place.photos) ? place.photos : []).forEach(photo => {
        addPhoto(photo?.url, placeName, photo?.caption);
      });
    }

    function createPhotoCard(photo, index) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "place-photo-card";
      card.setAttribute("aria-label", `Powiększ zdjęcie: ${photo.title}`);
      card.addEventListener("click", () => openPhoto(index));

      const image = document.createElement("img");
      image.src = photo.url;
      image.alt = photo.alt;
      image.loading = "lazy";
      image.decoding = "async";
      image.addEventListener("error", () => card.remove());

      const caption = document.createElement("span");
      caption.textContent = photo.description;
      caption.hidden = !photo.description;

      card.append(image, caption);
      return card;
    }

    function renderPlacePhotos(trip, place) {
      const tripName = text(trip.name, "Wyprawa bez nazwy");
      const placeName = text(place.name, "Miejsce bez nazwy");

      setHeader("Galeria miejsca", placeName,
        `Zdjęcia z miejsca w ramach wyprawy: ${tripName}.`,
        `list.html?trip=${encodeURIComponent(tripId)}`, "← Wróć do miejsc");

      gallery.replaceChildren();

      if (photos.length === 0) {
        createEmptyState("To miejsce nie ma jeszcze zdjęć.");
        return;
      }

      status.textContent = `Liczba zdjęć: ${photos.length}`;
      const fragment = document.createDocumentFragment();
      photos.forEach((photo, index) => {
        fragment.appendChild(createPhotoCard(photo, index));
      });
      gallery.appendChild(fragment);
    }

    function renderDialog() {
      const photo = photos[activePhotoIndex];
      if (!photo) return;

      dialogImage.src = photo.url;
      dialogImage.alt = photo.alt;
      dialogTitle.textContent = photo.description;
      dialogTitle.hidden = !photo.description;
      dialogDescription.textContent = "";
      dialogDescription.hidden = true;

      const showArrows = photos.length > 1;
      document.getElementById("dialogPrevious").hidden = !showArrows;
      document.getElementById("dialogNext").hidden = !showArrows;
    }

    function openPhoto(index) {
      activePhotoIndex = index;
      renderDialog();
      dialog.showModal();
    }

    function changePhoto(direction) {
      if (!photos.length) return;
      activePhotoIndex = (activePhotoIndex + direction + photos.length) % photos.length;
      renderDialog();
    }

    document.getElementById("dialogClose").addEventListener("click", () => dialog.close());
    document.getElementById("dialogPrevious").addEventListener("click", () => changePhoto(-1));
    document.getElementById("dialogNext").addEventListener("click", () => changePhoto(1));

    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });

    document.addEventListener("keydown", event => {
      if (!dialog.open || photos.length < 2) return;
      if (event.key === "ArrowLeft") changePhoto(-1);
      if (event.key === "ArrowRight") changePhoto(1);
      if (event.key === "Escape") dialog.close();
    });

    async function loadGallery() {
      try {
        if (!tripId) {
          const snapshot = await get(ref(database, "trips"));
          renderTripCovers(snapshot.val());
          return;
        }

        const tripSnapshot = await get(ref(database, `trips/${tripId}`));
        const trip = tripSnapshot.val();

        if (!trip) {
          createEmptyState("Nie znaleziono tej wyprawy.");
          return;
        }

        if (!placeId) {
          renderPlaceCovers(trip);
          return;
        }

        const place = trip.places?.[placeId];

        if (!place) {
          createEmptyState("Nie znaleziono tego miejsca.");
          return;
        }

        collectPlacePhotos(place);
        renderPlacePhotos(trip, place);
      } catch (error) {
        console.error("Błąd ładowania galerii:", error);
        createEmptyState("Nie udało się załadować galerii. Spróbuj odświeżyć stronę.");
      }
    }

    loadGallery();
  </script>
</body>
</html>
