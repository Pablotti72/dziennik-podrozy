<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria podróży | Dziennik podróży</title>
  <meta name="description" content="Wybierz podróż i zobacz związane z nią zdjęcia." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header class="gallery-header">
    <a class="gallery-brand" href="index.html">Dziennik podróży</a>
    <nav class="gallery-navigation" aria-label="Główna nawigacja">
      <a href="index.html">Mapa</a>
      <a class="is-active" href="list.html" aria-current="page">Galeria</a>
    </nav>
  </header>

  <main class="gallery-page">
    <a id="backToTrips" class="back-to-trips" href="list.html" hidden>← Wszystkie podróże</a>
    <section class="gallery-intro" aria-labelledby="galleryTitle">
      <p id="galleryEyebrow" class="gallery-eyebrow">Wspomnienia w kadrach</p>
      <h1 id="galleryTitle">Podróże</h1>
      <p id="galleryDescription">Wybierz podróż, aby zobaczyć zdjęcia odwiedzonych miejsc.</p>
    </section>
    <p id="galleryStatus" class="gallery-status" role="status">Ładowanie podróży…</p>
    <section id="galleryContent" class="travel-gallery" aria-live="polite"></section>
  </main>

  <dialog id="photoDialog" class="photo-dialog" aria-labelledby="dialogTitle">
    <button id="dialogClose" class="dialog-close" type="button" aria-label="Zamknij zdjęcie">×</button>
    <button id="dialogPrevious" class="dialog-arrow dialog-previous" type="button" aria-label="Poprzednie zdjęcie">‹</button>
    <figure class="dialog-figure">
      <img id="dialogImage" src="" alt="" />
      <figcaption><strong id="dialogTitle"></strong><span id="dialogDescription"></span></figcaption>
    </figure>
    <button id="dialogNext" class="dialog-arrow dialog-next" type="button" aria-label="Następne zdjęcie">›</button>
  </dialog>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcRB_dec2OunBPevgemcWouCfDP6dNZV4",
      authDomain: "moj-dziennik-podrozy.firebaseapp.com",
      databaseURL: "https://moj-dziennik-podrozy-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "moj-dziennik-podrozy",
      storageBucket: "moj-dziennik-podrozy.firebasestorage.app",
      messagingSenderId: "997572019753",
      appId: "1:997572019753:web:0f5aa78a1c24072de3be38"
    };

    const database = getDatabase(initializeApp(firebaseConfig));
    const gallery = document.getElementById("galleryContent");
    const status = document.getElementById("galleryStatus");
    const dialog = document.getElementById("photoDialog");
    const dialogImage = document.getElementById("dialogImage");
    const dialogTitle = document.getElementById("dialogTitle");
    const dialogDescription = document.getElementById("dialogDescription");
    const tripId = new URLSearchParams(window.location.search).get("trip");
    const photos = [];
    let activePhotoIndex = 0;

    function safeImageUrl(value) {
      if (typeof value !== "string" || value.trim() === "") return null;
      try {
        const url = new URL(value.trim(), window.location.href);
        return ["http:", "https:"].includes(url.protocol) ? url.href : null;
      } catch { return null; }
    }

    function text(value, fallback = "") {
      return typeof value === "string" && value.trim() ? value.trim() : fallback;
    }

    function createEmptyState(message) {
      gallery.replaceChildren();
      status.textContent = message;
    }

    function createTripCard(id, trip) {
      const imageUrl = safeImageUrl(trip.image);
      if (!imageUrl) return null;
      const name = text(trip.name, "Podróż bez nazwy");
      const link = document.createElement("a");
      link.className = "trip-cover-card";
      link.href = `list.html?trip=${encodeURIComponent(id)}`;
      link.setAttribute("aria-label", `Zobacz zdjęcia z podróży: ${name}`);

      const image = document.createElement("img");
      image.src = imageUrl;
      image.alt = `Okładka podróży: ${name}`;
      image.loading = "lazy";
      image.decoding = "async";
      image.addEventListener("error", () => link.remove());

      const overlay = document.createElement("div");
      overlay.className = "trip-cover-content";
      const label = document.createElement("span");
      label.textContent = "Otwórz podróż";
      const heading = document.createElement("h2");
      heading.textContent = name;
      overlay.append(label, heading);
      link.append(image, overlay);
      return link;
    }

    function renderTripCovers(trips) {
      gallery.replaceChildren();
      const fragment = document.createDocumentFragment();
      let count = 0;
      Object.entries(trips || {}).forEach(([id, trip]) => {
        const card = createTripCard(id, trip || {});
        if (card) { fragment.appendChild(card); count += 1; }
      });
      if (count === 0) return createEmptyState("Nie ma jeszcze podróży z okładkami do pokazania.");
      status.textContent = `Wybierz jedną z ${count} podróży.`;
      gallery.appendChild(fragment);
    }

    function addPlacePhoto(url, title, description) {
      const safeUrl = safeImageUrl(url);
      if (!safeUrl || photos.some((photo) => photo.url === safeUrl)) return;
      photos.push({ url: safeUrl, title, description, alt: description || `Zdjęcie miejsca: ${title}` });
    }

    function collectTripPhotos(trip) {
      Object.values(trip.places || {}).forEach((place) => {
        const placeName = text(place.name, "Miejsce bez nazwy");
        addPlacePhoto(place.image, placeName, "");
        (Array.isArray(place.photos) ? place.photos : []).forEach((photo) => {
          addPlacePhoto(photo?.url, placeName, text(photo?.caption, ""));
        });
      });
    }

    function createPhotoCard(photo, index) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "place-photo-card";
      card.setAttribute("aria-label", `Powiększ zdjęcie: ${photo.title}`);
      card.addEventListener("click", () => openPhoto(index));
      const image = document.createElement("img");
      image.src = photo.url;
      image.alt = photo.alt;
      image.loading = "lazy";
      image.decoding = "async";
      image.addEventListener("error", () => card.remove());
      const caption = document.createElement("span");
      caption.textContent = photo.description;
      caption.hidden = !photo.description;
      card.append(image, caption);
      return card;
    }

    function renderTripPhotos(trip) {
      const name = text(trip.name, "Podróż bez nazwy");
      document.getElementById("backToTrips").hidden = false;
      document.getElementById("galleryEyebrow").textContent = "Galeria podróży";
      document.getElementById("galleryTitle").textContent = name;
      document.getElementById("galleryDescription").textContent = "Zdjęcia miejsc odwiedzonych podczas tej podróży.";
      gallery.replaceChildren();
      if (photos.length === 0) return createEmptyState("Ta podróż nie ma jeszcze zdjęć miejsc.");
      status.textContent = `Liczba zdjęć: ${photos.length}`;
      const fragment = document.createDocumentFragment();
      photos.forEach((photo, index) => fragment.appendChild(createPhotoCard(photo, index)));
      gallery.appendChild(fragment);
    }

    function renderDialog() {
      const photo = photos[activePhotoIndex];
      if (!photo) return;
      dialogImage.src = photo.url;
      dialogImage.alt = photo.alt;
      dialogTitle.textContent = photo.title;
      dialogDescription.textContent = photo.description;
      const showArrows = photos.length > 1;
      document.getElementById("dialogPrevious").hidden = !showArrows;
      document.getElementById("dialogNext").hidden = !showArrows;
    }

    function openPhoto(index) { activePhotoIndex = index; renderDialog(); dialog.showModal(); }
    function changePhoto(direction) { activePhotoIndex = (activePhotoIndex + direction + photos.length) % photos.length; renderDialog(); }

    document.getElementById("dialogClose").addEventListener("click", () => dialog.close());
    document.getElementById("dialogPrevious").addEventListener("click", () => changePhoto(-1));
    document.getElementById("dialogNext").addEventListener("click", () => changePhoto(1));
    dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
    document.addEventListener("keydown", (event) => {
      if (!dialog.open || photos.length < 2) return;
      if (event.key === "ArrowLeft") changePhoto(-1);
      if (event.key === "ArrowRight") changePhoto(1);
    });

    async function loadGallery() {
      try {
        if (tripId) {
          const snapshot = await get(ref(database, `trips/${tripId}`));
          const trip = snapshot.val();
          if (!trip) return createEmptyState("Nie znaleziono tej podróży.");
          collectTripPhotos(trip);
          renderTripPhotos(trip);
        } else {
          const snapshot = await get(ref(database, "trips"));
          renderTripCovers(snapshot.val());
        }
      } catch (error) {
        console.error("Błąd ładowania galerii:", error);
        createEmptyState("Nie udało się załadować galerii. Spróbuj odświeżyć stronę.");
      }
    }

    loadGallery();
  </script>
</body>
</html>
