<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Wyprawy - GaPa Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="map.html" id="backToMapLink" class="btn-back">← Powrót do mapy</a>
            <h1 id="tripTitle">Ładowanie...</h1>
        </nav>
    </header>

    <main class="trip-container">
        <section class="trip-info">
            <p id="tripDescription"></p>
        </section>

        <section class="map-section">
            <div id="trip-map" style="height: 350px;"></div>
        </section>

        <section class="places-section">
            <h2>Odwiedzone Miejsca</h2>
            <div id="placesList" class="places-grid"></div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('id');

        const map = L.map('trip-map').setView([52.237, 21.017], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const backLink = document.getElementById('backToMapLink');

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        if (tripId) {
            get(ref(database, `trips/${tripId}`)).then((snapshot) => {
                const tripData = snapshot.val();
                if (tripData) {
                    document.getElementById("tripTitle").textContent = tripData.name;
                    document.getElementById("tripDescription").textContent = tripData.description || "Brak opisu.";

                    if (tripData.lat && tripData.lng) {
                        backLink.href = `map.html?lat=${tripData.lat}&lng=${tripData.lng}`;
                        
                        map.setView([tripData.lat, tripData.lng], 12);
                        L.marker([tripData.lat, tripData.lng])
                         .addTo(map)
                         .bindPopup(`<b>${escapeHtml(tripData.name)}</b>`)
                         .openPopup();
                    } else {
                        backLink.href = "map.html";
                    }

                    if (tripData.places) {
                        const placesList = document.getElementById("placesList");
                        placesList.innerHTML = "";
                        Object.entries(tripData.places).forEach(([placeId, place]) => {
                            const card = document.createElement("div");
                            card.className = "place-card";
                            card.innerHTML = `
                                <h3>${escapeHtml(place.name)}</h3>
                                <a href="place.html?id=${placeId}&tripId=${tripId}" class="btn-secondary">Zobacz miejsce</a>
                            `;
                            placesList.appendChild(card);
                        });
                    }
                }
            }).catch((error) => {
                console.error("Błąd ładowania wyprawy:", error);
                backLink.href = "map.html";
            });
        } else {
            backLink.href = "map.html";
        }
    </script>
</body>
</html>
