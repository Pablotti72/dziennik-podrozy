<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Wypraw - GaPa Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="index.html" class="nav-logo">GaPa Blog</a>
            <ul class="nav-links">
                <li><a href="index.html">Strona Główna</a></li>
                <li><a href="map.html" class="active">Mapa</a></li>
                <li><a href="list.html">Lista Wypraw</a></li>
            </ul>
        </nav>
    </header>

    <main class="map-page-container">
        <div id="main-map" style="height: calc(100vh - 80px); width: 100%;"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const map = L.map('main-map');

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        window.saveMapState = function() {
            sessionStorage.setItem('mapCenterLat', map.getCenter().lat);
            sessionStorage.setItem('mapCenterLng', map.getCenter().lng);
            sessionStorage.setItem('mapZoom', map.getZoom());
        };

        function restoreMapState() {
            const urlParams = new URLSearchParams(window.location.search);
            const returnLat = urlParams.get('lat');
            const returnLng = urlParams.get('lng');

            const savedLat = sessionStorage.getItem('mapCenterLat');
            const savedLng = sessionStorage.getItem('mapCenterLng');
            const savedZoom = sessionStorage.getItem('mapZoom');

            if (savedLat && savedLng && savedZoom) {
                map.setView([parseFloat(savedLat), parseFloat(savedLng)], parseInt(savedZoom));
            } else if (returnLat && returnLng) {
                map.setView([parseFloat(returnLat), parseFloat(returnLng)], 11);
            } else {
                map.setView([52.237, 21.017], 6);
            }
        }

        function loadTrips() {
            get(ref(database, 'trips')).then((snapshot) => {
                const trips = snapshot.val();
                if (trips) {
                    Object.entries(trips).forEach(([tripId, trip]) => {
                        if (trip.lat && trip.lng) {
                            const marker = L.marker([trip.lat, trip.lng]).addTo(map);
                            const popupContent = `
                                <div class="popup-content">
                                    <h3>${escapeHtml(trip.name)}</h3>
                                    <p>${escapeHtml(trip.description || '')}</p>
                                    <a href="trip.html?id=${tripId}" onclick="saveMapState()" class="btn-primary">Zobacz wyprawę</a>
                                </div>
                            `;
                            marker.bindPopup(popupContent);
                        }
                    });
                }
                restoreMapState();
            }).catch((error) => {
                console.error("Błąd podczas ładowania wypraw:", error);
                restoreMapState();
            });
        }

        loadTrips();
    </script>
</body>
</html>
