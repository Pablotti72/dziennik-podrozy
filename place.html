<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Miejsca - GaPa Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="#" id="backToTripLink" class="btn-back">← Powrót do wyprawy</a>
            <h1 id="placeTitle">Ładowanie...</h1>
        </nav>
    </header>

    <main class="place-container">
        <section class="place-info">
            <p id="placeDescription"></p>
        </section>

        <section class="gallery-section">
            <h2>Galeria zdjęć</h2>
            <div id="photoGallery" class="gallery-grid"></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const placeId = urlParams.get('id');
        const tripId = urlParams.get('tripId');

        const backButton = document.getElementById('backToTripLink');
        if (tripId) {
            backButton.href = `trip.html?id=${tripId}`;
        } else {
            backButton.href = "map.html";
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        if (placeId) {
            get(ref(database, `places/${placeId}`)).then((snapshot) => {
                const placeData = snapshot.val();
                if (placeData) {
                    document.getElementById("placeTitle").textContent = placeData.name;
                    document.getElementById("placeDescription").textContent = placeData.description || "Brak opisu.";

                    const gallery = document.getElementById("photoGallery");
                    gallery.innerHTML = "";

                    if (placeData.photos && Array.isArray(placeData.photos)) {
                        placeData.photos.forEach((url) => {
                            const img = document.createElement("img");
                            img.src = url;
                            img.alt = placeData.name;
                            img.className = "gallery-img";
                            gallery.appendChild(img);
                        });
                    }
                }
            }).catch((error) => {
                console.error("Błąd ładowania miejsca:", error);
            });
        }
    </script>
</body>
</html>
